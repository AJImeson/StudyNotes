workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:

  - validate
  - plan
  - apply
  - destroy

include:

  - local: 'terraform/terraform-ci.yml'
  - local: 'ansible/ansible-ci.yml'
