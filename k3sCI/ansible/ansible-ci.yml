
.ansible:
  image: python:3.12-slim
  before_script:
    - pip install --quiet ansible-core ansible-lint
  
ansible-lint:
  extends: .ansible
  stage: validate
  script:
    - ansible-playbook ansible/k3s-cluster.yml --syntax-check # Unmatched host patterns warning
    - ansible-lint ansible/
  allow_failure: true
