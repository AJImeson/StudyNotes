
- name: K3sTest
  hosts: k3s_server
  become: true
  tasks:
    - name: Install K3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server \
          --token {{ k3s_token }} \
          --tls-san {{ inventory_hostname }} \
          --node-external-ip {{ inventory_hostname }} \
          --write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: API pause
      ansible.builtin.wait_for:
        port: 6443
        timeout: 180

- name: Agent Handshake
  hosts: k3s_agents
  become: true
  tasks:
    - name: Node token reader
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['k3s_server'][0] }}"
      register: server_token

    - name: Install k3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL="https://{{ server_private_ip }}:6443" \
          K3S_TOKEN="{{ server_token.content | b64decode | trim }}" sh -
      args:
        creates: /usr/local/bin/k3s
