.terraform:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  variables:
    TF_STATE: "${CI_AP_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/k3s"
    TF_HTTP_ADDRESS: "${TF_STATE}"
    TF_HTTP_LOCK_ADDRESS: "${TF_STATE}/lock" 
    TF_HTTP_UNLOCK_ADDRESS: "${TF_STATE}/lock"
    TF_HTTP_LOCK_METHOD: POST
    TF_HTTP_UNLOCK_METHOD: DELETE
    TF_HTTP_USERNAME: gitlab-ci-token    
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"

  before_script:
    - cd terraform/
    - export TF_VAR_user_ip="$(curl -s ifconfig.me)/32"
    - terraform --version
    - terraform init

terraform-validate:
  extends: .terraform
  stage: validate
  script:
    - terraform validate
    - terraform fmt -check=true

terraform-plan:
  extends: .terraform
  stage: plan
  script:
    - terraform plan -input=false

terraform-apply:
  extends: .terraform
  stage: apply
  script:
    - terraform apply -auto-approve -input=false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform-destroy:
  stage: destroy
  script:
    - terraform destroy -auto-approve -input=false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual 
